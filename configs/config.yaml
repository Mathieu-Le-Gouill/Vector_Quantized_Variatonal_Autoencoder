defaults:
  - model: ae # ae, beta_vae, vae, vq_vae
  - training: train_default
  - evaluation: eval_default
  - visualization: visu_default

hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./outputs/sweep/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}